<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>TOMRİS · kapanış</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/profile.js"></script>
<style>
@font-face{font-family:"Inter Tight";font-weight:300;font-display:block;src:url("assets/fonts/inter-tight-latin-300-normal.woff2")format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Inter Tight";font-weight:300;font-display:block;src:url("assets/fonts/inter-tight-latin-ext-300-normal.woff2")format("woff2");unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"Inter Tight";font-weight:500;font-display:block;src:url("assets/fonts/inter-tight-latin-500-normal.woff2")format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Inter Tight";font-weight:500;font-display:block;src:url("assets/fonts/inter-tight-latin-ext-500-normal.woff2")format("woff2");unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:block;src:url("assets/fonts/jetbrains-mono-latin-600-normal.woff2")format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2212}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:block;src:url("assets/fonts/jetbrains-mono-latin-ext-600-normal.woff2")format("woff2");unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20C0}
/* End card, 7 s (210 frames). Same warm line and horizon as the opening: the opening's drawing of the boat returns
   (assets/profile.js, generated by ../opening/profile_lines.py), then the name, hull number, team and faculty.
   Fades in from the blue of the last 3D shot and fades slowly to black. */
:root{--warm:#F2C38B;--warm2:#FFE2B8;--line:#E9E4DC;--white:#F4EFE7;--silver:#DCD6CC;--muted:#ADA396}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;color:var(--silver);font-family:"Inter Tight",sans-serif;-webkit-font-smoothing:antialiased}
#pic{position:absolute;left:0;top:138px;width:1920px;height:804px;overflow:hidden;background:#000}
.bar{position:absolute;left:0;width:1920px;height:138px;background:#000;z-index:50}
#barT{top:0}#barB{top:942px}
#blue{position:absolute;left:0;top:0;width:1920px;height:804px;background:radial-gradient(90% 90% at 50% 45%,#1C3762 0%,#0D1D38 60%,#060D1B 100%)}
#card{position:absolute;left:0;top:0;width:1920px;height:804px;transform-origin:960px 380px}
#haze{position:absolute;left:0;top:0;width:1920px;height:804px;opacity:0;
  background:radial-gradient(46% 26% at 50% var(--hzy),rgba(255,214,160,.30) 0%,rgba(242,160,90,.10) 45%,rgba(0,0,0,0) 100%)}
#hz{position:absolute;left:0;width:1920px;height:2px;margin-top:-1px;transform-origin:50% 50%;
  background:linear-gradient(90deg,rgba(242,195,139,0) 0%,rgba(242,195,139,.45) 18%,var(--warm2) 50%,rgba(242,195,139,.45) 82%,rgba(242,195,139,0) 100%);
  box-shadow:0 0 6px rgba(242,195,139,.7),0 0 20px rgba(242,170,100,.3)}
svg{position:absolute;left:0;top:0;width:1920px;height:804px;display:block;overflow:visible}
#lines path{fill:none;stroke:var(--line);stroke-width:1.15;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000}
#lines .g-hull path{stroke-width:1.35}
#lines{filter:drop-shadow(0 0 2px rgba(255,236,210,.35))}
#glint path{fill:none;stroke:#FFF3E2;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#glint{filter:drop-shadow(0 0 4px rgba(255,214,160,.9)) drop-shadow(0 0 10px rgba(255,190,120,.4))}
.m{display:block;overflow:hidden}
#title{position:absolute;left:0;top:388px;width:1920px;display:flex;justify-content:center;padding-left:.3em;font-size:132px}
#title .m{padding:.16em 0 .06em;margin-top:-.12em}
#title .m>span{display:block;font-weight:300;line-height:1;color:var(--white);margin-right:.3em}
#title .m:last-child>span{margin-right:0}
#hull{position:absolute;left:0;top:548px;width:1920px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:24px;letter-spacing:.5em;padding-left:.5em;color:var(--warm)}
#names{position:absolute;left:0;top:622px;width:1920px;display:flex;justify-content:center;align-items:baseline;gap:22px;font-size:28px;font-weight:300;color:var(--silver)}
#names .sep{color:var(--muted)}
#fac{position:absolute;left:0;top:680px;width:1920px;text-align:center;font-size:22px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="7" data-fps="30">
  <div id="pic">
    <div id="card">
      <div id="haze"></div>
      <div id="hz"></div>
      <svg id="lines" viewBox="0 0 1920 804"></svg>
      <svg id="glint" viewBox="0 0 1920 804">
        <defs>
          <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <mask id="sweepMask" maskUnits="userSpaceOnUse" x="-400" y="-200" width="2720" height="1200">
            <rect id="sweepRect" x="-700" y="-200" width="380" height="1200" fill="url(#sweepGrad)"/>
          </mask>
        </defs>
        <g id="glintLines" mask="url(#sweepMask)"></g>
      </svg>
      <div id="title"></div>
      <div id="hull">TCB-1601</div>
      <div id="names"></div>
      <div id="fac">İTÜ Gemi İnşaatı ve Deniz Bilimleri Fakültesi</div>
    </div>
    <div id="blue"></div>
  </div>
  <div id="barT" class="bar"></div>
  <div id="barB" class="bar"></div>
</div>

<script>
const TEAM = ["Fatma Beyza Şahin", "Muhammed Sefa Coşgun", "Ekin Çağan Teymur", "Tunahan Yaylı", "Azra Gülhan"];
const NS = "http://www.w3.org/2000/svg", $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];

function build() {
  const P = window.TOMRIS_PROFILE;
  // the boat as a mark above the name: 600 px long, waterline on the horizon at picture y = 318
  const [bx0, by0, bx1, by1] = P.bbox, S = 600 / (bx1 - bx0), ox = 960 - S * (bx0 + bx1) / 2, HZY = 318;
  const X = (x) => (ox + S * x).toFixed(1), Y = (y) => (HZY - S * y).toFixed(1);
  $("#hz").style.top = HZY + "px";
  $("#pic").style.setProperty("--hzy", (HZY / 804 * 100).toFixed(1) + "%");
  const groups = {};
  for (const g of P.order) {
    const gl = document.createElementNS(NS, "g"); gl.setAttribute("class", "g-" + g); $("#lines").appendChild(gl);
    const gg = document.createElementNS(NS, "g"); $("#glintLines").appendChild(gg);
    groups[g] = [];
    for (let pl of P.groups[g]) {
      if (pl[0][0] > pl[pl.length - 1][0]) pl = pl.slice().reverse();
      const d = "M" + pl.map(([x, y]) => X(x) + " " + Y(y)).join(" L");
      const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("pathLength", "1000"); gl.appendChild(p);
      const q = document.createElementNS(NS, "path"); q.setAttribute("d", d); gg.appendChild(q);
      groups[g].push({ el: p, xa: Math.min(...pl.map((v) => v[0])), xb: Math.max(...pl.map((v) => v[0])) });
    }
  }
  $("#title").innerHTML = [..."TOMRİS"].map((c) => `<span class="m"><span>${c}</span></span>`).join("");
  $("#names").innerHTML = TEAM.map((n, i) => (i ? `<span class="sep">·</span>` : "") + `<span class="nm">${n}</span>`).join("");

  const tl = gsap.timeline({ paused: true });
  // 0-0.9 s: out of the last shot's blue into black; one slow push for the whole card
  tl.fromTo("#blue", { opacity: 1 }, { opacity: 0, duration: 0.9, ease: "power1.inOut" }, 0);
  tl.fromTo("#card", { scale: 1 }, { scale: 1.02, duration: 7, ease: "none" }, 0);
  // 0.2-1.5 s: the warm horizon returns
  tl.fromTo("#hz", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.3, ease: "expo.out" }, 0.2);
  tl.fromTo("#haze", { opacity: 0 }, { opacity: 1, duration: 1.8, ease: "power1.inOut" }, 0.4);
  // 0.5-2.0 s: the opening's drawing returns, bow to stern, quicker
  const PLAN = { hull: [0.5, 1.0], jets: [1.3, 0.3], house: [0.8, 0.85], deck: [0.9, 0.8], mast: [1.15, 0.65], gun: [0.95, 0.5], launcher: [1.3, 0.5], flag: [1.65, 0.35] };
  const E = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);
  for (const g of P.order) {
    const [t0, span] = PLAN[g] || [1.0, 0.7];
    const xa = Math.min(...groups[g].map((o) => o.xa)), xb = Math.max(...groups[g].map((o) => o.xb)), W = Math.max(xb - xa, 1e-6);
    for (const o of groups[g]) {
      const s0 = t0 + E((o.xa - xa) / W) * span, s1 = t0 + E((o.xb - xa) / W) * span;
      tl.to(o.el, { strokeDashoffset: 0, duration: Math.max(0.1, s1 - s0), ease: "none" }, s0);
    }
  }
  // 2.0-2.95 s: the soft light runs along it once
  tl.fromTo("#sweepRect", { attr: { x: -500 } }, { attr: { x: 2000 }, duration: 0.95, ease: "power1.inOut" }, 2.0);
  // 1.5-2.6 s: TOMRİS, letters rise from the centre outward; the hull number opens after it
  const L = $$("#title .m>span"), mid = (L.length - 1) / 2;
  L.forEach((s, i) => tl.fromTo(s, { yPercent: 135, x: (i - mid) * 18 }, { yPercent: 0, x: 0, duration: 1.0, ease: "expo.out" }, 1.5 + Math.abs(i - mid) * 0.07));
  tl.fromTo("#hull", { clipPath: "inset(0% 50% 0% 50%)", opacity: 0.4 }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.8, ease: "expo.out" }, 2.1);
  // 2.6-4.3 s: the team, one name after another, then the faculty
  $$("#names .nm").forEach((n, i) => tl.fromTo(n, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 2.6 + i * 0.14));
  $$("#names .sep").forEach((n, i) => tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 2.72 + i * 0.14));
  tl.fromTo("#fac", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 3.4);
  // 5.42-6.97 s: slow fade to black
  tl.to("#card", { opacity: 0, duration: 1.55, ease: "sine.inOut" }, 5.42);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
}
document.fonts.ready.then(build);
</script>
</body>
</html>
