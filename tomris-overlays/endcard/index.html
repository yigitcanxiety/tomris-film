<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>TOMRİS · kapanış</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:"Inter Tight";font-weight:300;font-display:block;src:url("assets/fonts/inter-tight-latin-300-normal.woff2")format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Inter Tight";font-weight:300;font-display:block;src:url("assets/fonts/inter-tight-latin-ext-300-normal.woff2")format("woff2");unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"Inter Tight";font-weight:500;font-display:block;src:url("assets/fonts/inter-tight-latin-500-normal.woff2")format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:"Inter Tight";font-weight:500;font-display:block;src:url("assets/fonts/inter-tight-latin-ext-500-normal.woff2")format("woff2");unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:block;src:url("assets/fonts/jetbrains-mono-latin-600-normal.woff2")format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2212}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:block;src:url("assets/fonts/jetbrains-mono-latin-ext-600-normal.woff2")format("woff2");unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20C0}

/* blue hour: deep blue light, cold silver type, cyan as the only accent. Built on pure black so it can be screen-blended. */
:root{--dusk:#16325C;--steel:#7F93AE;--haze:#A9C1DF;--silver:#DCE4EE;--white:#F3F6F9;--cyan:#46E3FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;color:var(--silver);font-family:"Inter Tight",sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}

#pic{position:absolute;left:0;top:138px;width:1920px;height:804px;overflow:hidden;background:#000}
.bar{position:absolute;left:0;width:1920px;height:138px;background:#000;z-index:50}
#barT{top:0}#barB{top:942px}

#card{position:absolute;left:0;top:18px;width:1920px;height:804px;transform-origin:960px 402px}
/* the last light of the sky, sitting on the waterline */
#glow{position:absolute;left:360px;top:150px;width:1200px;height:340px;border-radius:50%;background:radial-gradient(closest-side,rgba(22,50,92,.55),rgba(22,50,92,.18) 55%,rgba(22,50,92,0));opacity:0}

#mark{position:absolute;left:640px;top:58px;width:640px;height:280px;transform-origin:50% 270px}
#boat{position:absolute;left:0;top:0;width:640px;height:280px;filter:drop-shadow(0 0 3px rgba(70,227,255,.85)) drop-shadow(0 0 12px rgba(70,227,255,.3))}
#boatSoft{position:absolute;left:0;top:0;width:640px;height:280px;opacity:0}
.ln{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#boatSoft .ln{stroke:var(--haze);stroke-width:3.6}
.p-rail{stroke-width:5}
.glint{fill:none;stroke:#E9FCFF;stroke-width:5;stroke-linecap:round;stroke-dasharray:70 2000;stroke-dashoffset:70}

#wl{position:absolute;left:600px;top:327px;width:720px;height:2px;background:var(--cyan);box-shadow:0 0 8px rgba(70,227,255,.9),0 0 24px rgba(70,227,255,.35);transform-origin:50% 50%}

.m{display:block;overflow:hidden}
#title{position:absolute;left:0;top:384px;width:1920px;display:flex;justify-content:center;padding-left:.3em;font-size:150px}
#title .m{padding:.16em 0 .06em;margin-top:-.12em}
#title .m>span{display:block;font-weight:300;line-height:1;color:var(--white);margin-right:.3em}
#title .m:last-child>span{margin-right:0}
#hull{position:absolute;left:0;top:556px;width:1920px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:24px;letter-spacing:.5em;padding-left:.5em;color:var(--cyan)}
#names{position:absolute;left:0;top:628px;width:1920px;display:flex;justify-content:center;align-items:baseline;gap:22px;font-size:27px;font-weight:300;color:var(--silver)}
#names .sep{color:var(--steel)}
#fac{position:absolute;left:0;top:684px;width:1920px;text-align:center;font-size:21px;font-weight:500;letter-spacing:.04em;color:var(--steel)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="7" data-fps="30">
  <div id="pic">
    <div id="card">
      <div id="glow"></div>
      <div id="mark">
        <svg id="boatSoft" viewBox="150 100 1650 722"><g transform="rotate(-2.2 971 458)"></g></svg>
        <svg id="boat" viewBox="150 100 1650 722"><g transform="rotate(-2.2 971 458)"></g></svg>
      </div>
      <div id="wl"></div>
      <div id="title"></div>
      <div id="hull">TCB-1601</div>
      <div id="names"></div>
      <div id="fac">İTÜ Gemi İnşaatı ve Deniz Bilimleri Fakültesi</div>
    </div>
  </div>
  <div id="barT" class="bar"></div>
  <div id="barB" class="bar"></div>
</div>

<script>
// TOMRİS side profile, redrawn from tomris-ref/tekne-v3/master_varA_2K.jpg (same data as opening/index.html). Bow left.
const PROFILE = [
  ["hull",   "M184 548 L1762 642 L1760 792 L336 724 C268 690 214 634 180 566 Z"],
  ["rail",   "M178 562 L1764 680 M184 576 L1762 694"],
  ["cabin",  "M604 572 L648 530 L822 488 L940 396 L1342 400 L1368 522 L1376 618"],
  ["belt",   "M812 512 L1366 522"],
  ["shield", "M838 486 L914 426 L946 424 L880 494 Z"],
  ["window", "M986 420 L1230 438 L1196 500 L930 506 Z M1080 428 L1064 504"],
  ["mast",   "M1228 398 L1270 300 L1294 232 L1300 194 M1310 398 L1322 300 L1336 222 L1334 194 M1304 194 L1336 194 L1336 164 L1304 164 Z M1318 164 L1314 124"],
  ["radar",  "M1156 248 L1256 248 L1256 262 L1156 262 Z M1196 262 L1196 290 L1228 290 L1228 262 M1182 292 L1262 300"],
  ["eoir",   "M1156 346 A22 22 0 1 0 1200 346 A22 22 0 1 0 1156 346 M1162 364 L1158 396 M1196 364 L1200 396"],
  ["cam2",   "M1074 350 A14 14 0 1 0 1102 350 A14 14 0 1 0 1074 350 M1084 364 L1084 398 M1094 364 L1094 398 M1055 336 L1055 397"],
  ["flag",   "M1350 226 C1372 220 1392 240 1416 234 L1412 290 C1390 296 1372 276 1350 282 Z M1346 226 L1328 398 M1350 222 L1350 140"],
  ["gun",    "M512 567 L512 524 L498 524 L498 480 L534 470 L606 470 L616 484 L616 524 L600 524 L600 572 M542 470 L542 452 L592 452 L598 470 M404 448 L536 452"],
  ["launch", "M1392 468 L1690 534 L1700 548 L1684 556 L1386 488 Z M1392 500 L1690 566 L1700 580 L1684 588 L1386 520 Z M1500 626 L1512 572 L1556 576 L1566 630"]
];
const TEAM = ["Fatma Beyza Şahin", "Muhammed Sefa Coşgun", "Ekin Çağan Teymur", "Tunahan Yaylı", "Azra Gülhan"];

const NS = "http://www.w3.org/2000/svg", $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };

function buildDom() {
  for (const [k, d] of PROFILE) {
    el("path", {d, class: "ln p-" + k}, $("#boat g"));
    el("path", {d, class: "ln"}, $("#boatSoft g"));
  }
  // the glint runs bow to stern along the sheer and the rub rail
  for (const k of ["hull", "rail"]) el("path", {d: PROFILE.find(p => p[0] === k)[1], class: "glint", pathLength: 1000}, $("#boatSoft g"));
  $("#title").innerHTML = [..."TOMRİS"].map(c => `<span class="m"><span>${c}</span></span>`).join("");
  $("#names").innerHTML = TEAM.map((n, i) => (i ? `<span class="sep">·</span>` : "") + `<span class="nm">${n}</span>`).join("");
}

function build() {
  buildDom();
  const tl = gsap.timeline({paused: true});

  /* 0–7 s : one slow push, so nothing is ever completely still */
  tl.fromTo("#card", {scale: 1}, {scale: 1.025, duration: 7, ease: "none"}, 0);
  tl.fromTo("#glow", {opacity: 0, scaleX: .6}, {opacity: 1, scaleX: 1, duration: 2.4, ease: "power2.out"}, .3);

  /* 0–0.55 s : the waterline, the same line the opening ended on */
  tl.fromTo("#wl", {scaleX: 0}, {scaleX: 1, duration: .6, ease: "expo.out"}, 0);

  /* 0.4–1.3 s : the boat rises out of the line (the opening's collapse, reversed) and the signal catches */
  tl.fromTo("#mark", {scaleY: .004}, {scaleY: 1, duration: .9, ease: "expo.out"}, .4);
  [[.47, .35], [.5, 1], [.57, .5], [.6, 1]].forEach(([t, o]) => tl.set("#boat", {opacity: o}, t));

  /* 1.1–2.0 s : the line hands over. it tightens to a short rule and drops under the name */
  tl.to("#wl", {scaleX: 56 / 720, y: 244, duration: .95, ease: "power3.inOut"}, 1.1);
  // ...and opens again as the hull number, which is wiped out of it
  tl.to("#wl", {scaleX: 300 / 720, opacity: 0, duration: .7, ease: "expo.out"}, 2.05);

  /* 1.3–2.6 s : cyan cools to blue-hour silver; the mark stops glowing and becomes a mark */
  tl.to("#boatSoft", {opacity: 1, duration: 1.2, ease: "power1.inOut"}, 1.3);
  tl.to("#boat", {opacity: 0, duration: 1.2, ease: "power1.inOut"}, 1.3);

  /* 1.45–2.5 s : TOMRİS, letters rise from the centre outward */
  const L = $$("#title .m>span"), mid = (L.length - 1) / 2;
  L.forEach((s, i) => tl.fromTo(s, {yPercent: 135, x: (i - mid) * 22}, {yPercent: 0, x: 0, duration: 1.0, ease: "expo.out"}, 1.45 + Math.abs(i - mid) * .07));

  /* 2.05 s : the hull number opens out of the rule */
  tl.fromTo("#hull", {clipPath: "inset(0% 50% 0% 50%)", opacity: .4}, {clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: .7, ease: "expo.out"}, 2.05);

  /* 2.6–3.7 s : the team, one name after another */
  $$("#names .nm").forEach((n, i) => tl.fromTo(n, {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: .7, ease: "power3.out"}, 2.6 + i * .13));
  $$("#names .sep").forEach((n, i) => tl.fromTo(n, {opacity: 0}, {opacity: 1, duration: .4, ease: "power1.out"}, 2.72 + i * .13));
  tl.fromTo("#fac", {opacity: 0, y: 10}, {opacity: 1, y: 0, duration: .8, ease: "power3.out"}, 3.35);

  /* 4.2–5.2 s : one glint runs the length of the hull */
  tl.fromTo("#boatSoft .glint", {strokeDashoffset: 70}, {strokeDashoffset: -1000, duration: 1.05, ease: "power2.inOut"}, 4.2);

  /* 6.35–7.0 s : out to black */
  tl.to("#card", {opacity: 0, duration: .65, ease: "power2.in"}, 6.35);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
}

document.fonts.ready.then(build);
</script>
</body>
</html>
