<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>TOMRİS · açılış</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/profile.js"></script>
<style>
/* Text-free 5 s opening (150 frames). Black; a thin warm horizon grows across the 2.39:1 picture; TOMRİS's true port
   profile (assets/profile.js, generated from tomris.blend by profile_lines.py) draws itself bow to stern; a soft light
   sweeps along the lines; the horizon swells into a warm flash that hands over to shot 2 (sunset harbour). */
:root{--warm:#F2C38B;--warm2:#FFE2B8;--line:#E9E4DC}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000}
#pic{position:absolute;left:0;top:138px;width:1920px;height:804px;overflow:hidden;background:#000}
.bar{position:absolute;left:0;width:1920px;height:138px;background:#000;z-index:50}
#barT{top:0}#barB{top:942px}
/* horizon: a hairline with a warm bloom, grown from the centre */
#hz{position:absolute;left:0;width:1920px;height:2px;margin-top:-1px;transform-origin:50% 50%;
  background:linear-gradient(90deg,rgba(242,195,139,0) 0%,rgba(242,195,139,.55) 14%,var(--warm2) 50%,rgba(242,195,139,.55) 86%,rgba(242,195,139,0) 100%);
  box-shadow:0 0 6px rgba(242,195,139,.75),0 0 22px rgba(242,170,100,.35)}
#haze{position:absolute;left:0;top:0;width:1920px;height:804px;opacity:0;
  background:radial-gradient(60% 34% at 50% var(--hzy),rgba(255,214,160,.55) 0%,rgba(242,160,90,.18) 45%,rgba(0,0,0,0) 100%)}
#flash{position:absolute;left:0;top:0;width:1920px;height:804px;opacity:0;
  background:radial-gradient(95% 85% at 50% var(--hzy),#FFF4E4 0%,#F8DEBC 45%,#E6C29C 100%)}
#boatWrap{position:absolute;left:0;top:0;width:1920px;height:804px;transform-origin:50% 60%}
svg{position:absolute;left:0;top:0;width:1920px;height:804px;display:block;overflow:visible}
#lines path{fill:none;stroke:var(--line);stroke-width:1.35;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;opacity:.92}
#lines .g-hull path{stroke-width:1.6}
#lines{filter:drop-shadow(0 0 2px rgba(255,236,210,.35))}
#glint path{fill:none;stroke:#FFF3E2;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#glint{filter:drop-shadow(0 0 4px rgba(255,214,160,.9)) drop-shadow(0 0 12px rgba(255,190,120,.45))}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="5" data-fps="30">
  <div id="pic">
    <div id="haze"></div>
    <div id="hz"></div>
    <div id="boatWrap">
      <svg id="lines" viewBox="0 0 1920 804"></svg>
      <svg id="glint" viewBox="0 0 1920 804">
        <defs>
          <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <mask id="sweepMask" maskUnits="userSpaceOnUse" x="-400" y="-200" width="2720" height="1200">
            <rect id="sweepRect" x="-700" y="-200" width="520" height="1200" fill="url(#sweepGrad)"/>
          </mask>
        </defs>
        <g id="glintLines" mask="url(#sweepMask)"></g>
      </svg>
    </div>
    <div id="flash"></div>
  </div>
  <div id="barT" class="bar"></div>
  <div id="barB" class="bar"></div>
</div>

<script>
(function () {
  const P = window.TOMRIS_PROFILE, NS = "http://www.w3.org/2000/svg";
  // layout: the boat centred in the 1920x804 picture, 1180 px long; the waterline (y = 0 m) is the horizon
  const [bx0, by0, bx1, by1] = P.bbox, S = 1180 / (bx1 - bx0);
  const ox = 960 - S * (bx0 + bx1) / 2, oy = 402 + S * (by0 + by1) / 2 + 18;
  const X = (x) => (ox + S * x).toFixed(1), Y = (y) => (oy - S * y).toFixed(1);
  const HZY = oy;                                                     // horizon = waterline, picture px
  document.getElementById("hz").style.top = HZY + "px";
  document.getElementById("pic").style.setProperty("--hzy", (HZY / 804 * 100).toFixed(1) + "%");

  const lines = document.getElementById("lines"), glint = document.getElementById("glintLines");
  const groups = {};
  for (const g of P.order) {
    const gl = document.createElementNS(NS, "g"); gl.setAttribute("class", "g-" + g); lines.appendChild(gl);
    const gg = document.createElementNS(NS, "g"); glint.appendChild(gg);
    groups[g] = [];
    for (let pl of P.groups[g]) {
      if (pl[0][0] > pl[pl.length - 1][0]) pl = pl.slice().reverse();   // every line draws bow -> stern
      const d = "M" + pl.map(([x, y]) => X(x) + " " + Y(y)).join(" L");
      const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("pathLength", "1000"); gl.appendChild(p);
      const q = document.createElementNS(NS, "path"); q.setAttribute("d", d); gg.appendChild(q);
      groups[g].push({ el: p, xa: Math.min(...pl.map((v) => v[0])), xb: Math.max(...pl.map((v) => v[0])) });
    }
  }

  const tl = gsap.timeline({ paused: true });
  // 0.15-1.5 s: the horizon grows out from the centre, warm
  tl.fromTo("#hz", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.5, ease: "expo.out" }, 0.15);
  tl.fromTo("#haze", { opacity: 0 }, { opacity: 0.35, duration: 2.0, ease: "power1.inOut" }, 0.4);
  // 0.7-3.3 s: the profile draws itself. Each group has one drawing front that travels bow -> stern (eased); every
  // line is drawn while the front crosses its x extent, so fragments of one chine join into a single moving stroke
  const PLAN = { hull: [0.7, 1.8], jets: [2.2, 0.35], house: [1.2, 1.4], deck: [1.4, 1.3], mast: [1.85, 1.0], gun: [1.55, 0.7], launcher: [2.05, 0.8], flag: [2.6, 0.45] };
  const E = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);
  for (const g of P.order) {
    const [t0, span] = PLAN[g] || [1.5, 1.0];
    const xa = Math.min(...groups[g].map((o) => o.xa)), xb = Math.max(...groups[g].map((o) => o.xb)), W = Math.max(xb - xa, 1e-6);
    for (const o of groups[g]) {
      const s0 = t0 + E((o.xa - xa) / W) * span, s1 = t0 + E((o.xb - xa) / W) * span;
      tl.to(o.el, { strokeDashoffset: 0, duration: Math.max(0.12, s1 - s0), ease: "none" }, s0);
    }
  }
  // slow push-in for the whole 5 s: the camera never stops
  tl.fromTo("#boatWrap", { scale: 1.0 }, { scale: 1.045, duration: 5, ease: "none" }, 0);
  // 3.0-4.1 s: a soft light sweeps along the finished lines, bow to stern
  tl.fromTo("#sweepRect", { attr: { x: -700 } }, { attr: { x: 2100 }, duration: 1.15, ease: "power1.inOut" }, 3.0);
  // 4.0-5.0 s: lines recede, the horizon swells into warm light; frames 147-149 are a warm flash into shot 2
  tl.to("#lines", { opacity: 0.3, duration: 0.8, ease: "power1.in" }, 4.0);
  tl.fromTo("#hz", { scaleY: 1 }, { scaleY: 6, duration: 0.9, ease: "power2.in", immediateRender: false }, 4.05);
  tl.to("#haze", { opacity: 1, duration: 0.9, ease: "power2.in" }, 4.05);
  tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.52, ease: "expo.in" }, 4.45);
  tl.to({}, { duration: 0.01 }, 4.99);                                 // timeline spans the full 5 s

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
