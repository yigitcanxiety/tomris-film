<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>TOMRİS water look test</title>
<!-- water/sky look test: the original 12 s, 4-shot test film on the current engine modules.
     render: npx hyperframes render --composition assets/env/looktest.html -->
<script src="../vendor/gsap.min.js"></script>
<script type="importmap">
  { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px}
#gl{position:absolute;left:0;top:138px;width:1920px;height:804px;display:block}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
  <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0"><canvas id="gl" width="1920" height="804"></canvas></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.to({}, { duration: 12 }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
<script type="module">
import { createEngine } from "../js/engine.js";
import { makeStateAt } from "./looktest_film.js";
const SUB = 8, FPS = 30;
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
let engine = null, stateAt = null;
function renderAt(t) {
  if (!engine) return;
  engine.renderFrame(t, stateAt, { subframes: SUB, fps: FPS, shutter: 0.125, frame: Math.round(t * FPS) });
}
window.__hf.buildReady["tomris-3d"] = (async () => {
  engine = await createEngine(document.getElementById("gl"), {
    base: "../", skies: { sunset: "hdri/belfast_sunset_puresky_2k.hdr", dusk: "hdri/qwantani_dusk_2_puresky_2k.hdr" },
  });
  stateAt = makeStateAt(engine.sea);
  window.__tomris = { engine, stateAt, renderAt };
  renderAt(0.0); renderAt(9.5);
  renderAt(window.__hfThreeTime || 0);
})();
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
</script>
</body>
</html>
